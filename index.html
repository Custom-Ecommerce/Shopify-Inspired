<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markazify - project tracker</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1; --card: #ffffff; --card-2: #fafaf8; --line: #e2e1dc; --track: #e7e6e1;
  --ink: #111110; --ink-2: #53524d; --ink-3: #74736d;
  --accent: #2563c9; --accent-tint: #e8f0fc;
  --good: #1b8a3d; --tint-good: #e6f4ea;
  --warn: #b26a00; --tint-warn: #fdf1d6;
  --crit: #c53030; --tint-crit: #fbe7e7;
  --mute: #7d7c76; --tint-mute: #eeede9;
  --shadow: 0 1px 2px rgba(17,17,16,.05), 0 4px 14px rgba(17,17,16,.04);
  --r: 14px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141413; --card: #1e1e1d; --card-2: #232322; --line: #34332f; --track: #373734;
  --ink: #f1f0ec; --ink-2: #c4c3b9; --ink-3: #a09f96;
  --accent: #5b9bf0; --accent-tint: #1a2a42;
  --good: #4cc26b; --tint-good: #16301d;
  --warn: #f0b24a; --tint-warn: #382f16;
  --crit: #f07272; --tint-crit: #3b1d1d;
  --mute: #8f8e88; --tint-mute: #2b2b29;
  --shadow: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141413; --card: #1e1e1d; --card-2: #232322; --line: #34332f; --track: #373734;
    --ink: #f1f0ec; --ink-2: #c4c3b9; --ink-3: #a09f96;
    --accent: #5b9bf0; --accent-tint: #1a2a42;
    --good: #4cc26b; --tint-good: #16301d;
    --warn: #f0b24a; --tint-warn: #382f16;
    --crit: #f07272; --tint-crit: #3b1d1d;
    --mute: #8f8e88; --tint-mute: #2b2b29;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 130px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: env(safe-area-inset-bottom); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 14px 48px; }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 26px 0 10px; font-weight: 700; }
[hidden] { display: none !important; }

/* header + nav */
header.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top)) 0 0; }
header.top .in { max-width: 1080px; margin: 0 auto; padding: 0 14px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 800; font-size: 17px; flex: none; }
.brand .grow { flex: 1; min-width: 0; }
.brand h1 { font-size: 17px; margin: 0; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
.brand .sub { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { min-width: 44px; min-height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; font-size: 13px; padding: 0 12px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 10px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
.tab { flex: none; min-height: 46px; padding: 5px 13px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; text-align: left; display: grid; align-content: center; }
.tab b { font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.tab small { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab[aria-selected="true"] small { color: color-mix(in srgb, var(--bg) 75%, transparent); }
.tab.gap { margin-left: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--mute); }
.dot.done { background: var(--good); } .dot.progress { background: var(--accent); } .dot.next { background: #f2a900; } .dot.planned { background: transparent; box-shadow: inset 0 0 0 2px var(--mute); }

/* generic */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 16px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; flex-wrap: wrap; }
.muted { color: var(--ink-2); } .small { font-size: 13px; }
.bar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .35s ease; }
.bar.good > i { background: var(--good); }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--tint-mute); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.tag.p0 { background: var(--tint-crit); color: var(--crit); border-color: transparent; }
.tag.p1 { background: var(--tint-warn); color: var(--warn); border-color: transparent; }
.tag.p2 { background: var(--tint-mute); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 650; border: 1px solid transparent; white-space: nowrap; }
.pill.done { background: var(--tint-good); color: var(--good); }
.pill.progress { background: var(--accent-tint); color: var(--accent); }
.pill.next { background: var(--tint-warn); color: var(--warn); }
.pill.planned, .pill.todo { background: var(--tint-mute); color: var(--ink-2); border-color: var(--line); }
.pill.blocked { background: var(--tint-crit); color: var(--crit); }
.empty { text-align: center; color: var(--ink-2); padding: 26px 8px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }

/* overview */
.hero { padding: 18px; display: grid; gap: 14px; margin-top: 16px; }
.hero .big { font-size: 40px; font-weight: 750; letter-spacing: -.03em; line-height: 1; }
.hero .big small { display: block; font-size: 14px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; margin-top: 6px; }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); margin-top: 12px; }
@media (min-width: 720px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
.tile { padding: 12px 14px; }
.tile .lbl { font-size: 12.5px; color: var(--ink-2); }
.tile .val { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.tile .val small { font-size: 13px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
.road { display: flex; gap: 3px; height: 34px; }
.road a { display: grid; place-items: center; font-size: 12px; font-weight: 700; border-radius: 8px; text-decoration: none; min-width: 26px; color: var(--ink); background: var(--tint-mute); border: 1px solid var(--line); }
.road a.done { background: var(--good); color: #fff; border-color: var(--good); }
.road a.progress { background: var(--accent); color: #fff; border-color: var(--accent); }
.road a.next { background: #f2a900; color: #1a1a19; border-color: #f2a900; }
.rm { display: grid; gap: 8px; }
.rm a { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; text-decoration: none; color: inherit; }
.rm .n { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-weight: 750; background: var(--tint-mute); grid-row: span 2; }
.rm .n.done { background: var(--tint-good); color: var(--good); } .rm .n.next { background: var(--tint-warn); color: var(--warn); } .rm .n.progress { background: var(--accent-tint); color: var(--accent); }
.rm .nm { font-weight: 650; } .rm .ch { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 5px; }
.rm .pts { font-size: 13px; color: var(--ink-2); text-align: right; }
.next-card { border-color: #f2a900; }
.next-card .eps { display: grid; gap: 8px; margin-top: 12px; }
.next-card .ep { display: grid; gap: 4px; padding-top: 8px; border-top: 1px solid var(--line); }
.next-card .ep .tg { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.pr { display: grid; gap: 10px; }
.pr .r { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; font-size: 13.5px; }

/* epics */
.toolbar { display: grid; gap: 10px; margin: 16px 0 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 4px 13px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; font-size: 13.5px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.search { width: 100%; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; }
.ep-card { padding: 14px; display: grid; gap: 9px; align-content: start; }
.ep-card .hd { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.ep-card .id { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .03em; }
.ep-card .nm { font-weight: 700; font-size: 16px; line-height: 1.25; }
.ep-card .meta { display: flex; flex-wrap: wrap; gap: 5px; }
.ep-card details { border-top: 1px solid var(--line); padding-top: 8px; }
.ep-card summary { cursor: pointer; min-height: 32px; font-size: 13.5px; font-weight: 600; color: var(--accent); list-style: none; display: flex; align-items: center; }
.ep-card summary::-webkit-details-marker { display: none; }
.ep-card summary::before { content: "\25B8"; margin-right: 6px; transition: transform .15s; }
.ep-card details[open] summary::before { transform: rotate(90deg); }
.ep-card .dl { display: grid; gap: 8px; font-size: 13.5px; color: var(--ink-2); margin-top: 6px; overflow-wrap: anywhere; }
.ep-card .dl b { color: var(--ink); font-weight: 650; }
.ep-card ul { margin: 4px 0 0; padding-left: 18px; }

/* clusters */
.cl { padding: 16px; display: grid; gap: 12px; margin-bottom: 14px; }
.cl .ttl { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.cl h3 { margin: 2px 0 0; font-size: 18px; letter-spacing: -.01em; line-height: 1.25; }
.cl .mini { display: flex; flex-wrap: wrap; gap: 6px; }
.cl .eprow { display: grid; grid-template-columns: 62px 1fr; gap: 3px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.cl .eprow .nm { font-weight: 650; }
.cl .eprow .mt { grid-column: 2; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 13px; color: var(--ink-2); }
.cl .why { font-size: 14px; color: var(--ink-2); }
.cl .dep { font-size: 13.5px; padding: 8px 12px; border-radius: 10px; background: var(--tint-mute); color: var(--ink-2); }
.cl .go { justify-self: start; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--accent); font-weight: 650; background: var(--card); }
.cbar { display: flex; gap: 3px; height: 40px; }
.cbar a { display: grid; place-items: center; font-size: 12.5px; font-weight: 700; border-radius: 9px; text-decoration: none; color: var(--ink); background: var(--tint-mute); border: 1px solid var(--line); min-width: 30px; }
.cbar a.next { background: #f2a900; border-color: #f2a900; color: #1a1a19; }
.cbar a.progress { background: var(--accent); border-color: var(--accent); color: #fff; }
.cgrid { display: grid; gap: 14px; }
@media (min-width: 900px) { .cgrid { grid-template-columns: 1fr 1fr; align-items: start; } }

/* sprint detail */
.banner { margin-top: 16px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card); display: grid; gap: 6px; }
.banner.next { border-color: #f2a900; background: var(--tint-warn); }
.banner h2 { margin: 0; font-size: 19px; letter-spacing: -.01em; min-width: 0; overflow-wrap: anywhere; flex: 1 1 220px; }
.goal { margin-top: 12px; }
.goal summary { list-style: none; padding: 12px 16px; min-height: 46px; font-weight: 650; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.goal summary::-webkit-details-marker { display: none; }
.goal summary::after { content: "+"; color: var(--ink-3); font-size: 20px; }
.goal[open] summary::after { content: "\2212"; }
.goal .body { padding: 0 16px 16px; color: var(--ink-2); font-size: 14.5px; }
.goal .body h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 12px 0 4px; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; }
.batch { flex: none; min-width: 150px; min-height: 64px; padding: 9px 12px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; text-align: left; display: grid; gap: 4px; }
.batch .t { font-weight: 700; font-size: 14px; } .batch .n { font-size: 12px; color: var(--ink-2); }
.batch[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.story { margin-bottom: 10px; overflow: hidden; }
.story summary { list-style: none; cursor: pointer; padding: 12px 14px; min-height: 52px; display: grid; gap: 7px; }
.story summary::-webkit-details-marker { display: none; }
.story .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.story .s-name { font-weight: 650; } .story .s-id { font-size: 12px; color: var(--ink-3); } .story .s-count { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.task { padding: 10px 14px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.task .tx { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.task .meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.gate { padding: 12px 14px; margin-bottom: 10px; display: grid; gap: 6px; }
.gate .g-id { font-weight: 700; } .gate .g-tx { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; } .gate .g-st { font-size: 12.5px; color: var(--ink-3); overflow-wrap: anywhere; }
footer.f { margin-top: 28px; font-size: 13px; color: var(--ink-2); }
.btn { min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; }
.msg { min-height: 1.4em; margin-top: 6px; } .msg.err { color: var(--crit); }
@media (min-width: 900px) { .two { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; align-items: start; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="brand">
      <div class="logo" aria-hidden="true">M</div>
      <div class="grow"><h1>Markazify tracker</h1><div class="sub" id="sub"></div></div>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch light or dark theme">Theme</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
  </div>
</header>

<main class="wrap">
  <!-- OVERVIEW -->
  <section id="vOverview" hidden></section>

  <!-- EPICS -->
  <section id="vEpics" hidden>
    <div class="toolbar">
      <div class="chips" id="fStatus" role="group" aria-label="Filter by status"></div>
      <div class="chips" id="fPrio" role="group" aria-label="Filter by priority"></div>
      <input class="search" id="eq" type="search" placeholder="Search an epic, id, scope or word" aria-label="Search epics" autocomplete="off">
      <div class="small muted" id="eCount" role="status"></div>
    </div>
    <div class="grid" id="eGrid"></div>
  </section>

  <!-- CLUSTERS -->
  <section id="vClusters" hidden></section>

  <!-- SPRINT: planned / next (no CSV yet) -->
  <section id="vPlan" hidden></section>

  <!-- SPRINT: has CSV -->
  <section id="vSprint" hidden>
    <div class="banner" id="sBanner"></div>
    <details class="goal card" id="goal">
      <summary>Sprint goal</summary>
      <div class="body"><p id="goalText"></p><h3>Done when</h3><p id="goalGate"></p></div>
    </details>
    <section class="kpis" aria-label="Sprint numbers">
      <div class="tile card"><div class="lbl">Tasks done</div><div class="val" id="kDone">0</div></div>
      <div class="tile card"><div class="lbl">In progress</div><div class="val" id="kProg">0</div></div>
      <div class="tile card"><div class="lbl">Not started</div><div class="val" id="kTodo">0</div></div>
      <div class="tile card"><div class="lbl">Gates passed</div><div class="val" id="kGate">0</div></div>
    </section>
    <div class="card pad" style="margin-top:12px">
      <div class="row small"><span>Tasks finished</span><b id="oTxt">0%</b></div>
      <div class="bar good" style="margin-top:8px"><i id="oFill"></i></div>
    </div>
    <h2 class="sec">Batches</h2>
    <div class="strip" id="batches" role="group" aria-label="Filter by batch"></div>
    <h2 class="sec">Stories and tasks</h2>
    <div class="chips" id="filters" role="group" aria-label="Filter by status"></div>
    <input class="search" id="q" type="search" placeholder="Search a task, id or word" aria-label="Search tasks" autocomplete="off" style="margin-top:10px">
    <div id="stories" style="margin-top:12px"></div>
    <h2 class="sec">Verification gates</h2>
    <div id="gates"></div>
    <footer class="f">
      <button class="btn" id="load" type="button">Reload from CSV</button>
      <input type="file" id="file" accept=".csv,text/csv" hidden>
      <div class="msg" id="msg" role="status"></div>
      <div id="src"></div>
    </footer>
  </section>
</main>

<script>

/* ---------- router ---------- */
function show(id) { ["vOverview", "vEpics", "vClusters", "vPlan", "vSprint"].forEach((x) => { $(x).hidden = x !== id; }); }
function route() {
  let h = (location.hash || "").replace("#", "") || "overview";
  if (!TABS.some((t) => t.id === h)) h = "overview";
  renderTabs(h);
  const sp = (h.match(/^s(\d+)$/) || [])[1];
  if (h === "overview") { show("vOverview"); renderOverview(); }
  else if (h === "epics") { show("vEpics"); renderEpics(); }
  else if (h === "clusters") { show("vClusters"); renderClusters(); }
  else { const s = SPR.find((x) => x.n === Number(sp)); if (s.m) { show("vSprint"); renderSprint(s); } else { show("vPlan"); renderPlan(s); } }
  $("sub").textContent = h === "overview" ? donePts + " of " + totalPts + " points done · " + epicsDone + " of " + D.epics.length + " epics" : h === "epics" ? "All " + D.epics.length + " epics, done and upcoming" : h === "clusters" ? CL.length + " clusters, one sprint each" : SPR.find((x) => x.n === Number(sp)).name;
  window.scrollTo(0, 0);
}
function setTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
$("theme").onclick = () => { const cur = document.documentElement.getAttribute("data-theme"); const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; setTheme(dark ? "light" : "dark"); };
$("eq").addEventListener("input", (e) => { eState.q = e.target.value.trim(); renderEpics(); });
$("q").addEventListener("input", (e) => { sState.q = e.target.value.trim(); renderSprint(sState.s); });
$("load").onclick = () => $("file").click();
$("file").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
  rd.onload = () => { try { const mm = model(String(rd.result)); if (!mm.tasks.length) throw new Error("No tasks found in this file."); sState.s.m = mm; sState.m = mm; renderSprint(sState.s); $("msg").className = "msg"; $("msg").textContent = "Reloaded " + mm.tasks.length + " tasks and " + mm.gates.length + " gates from " + f.name + "."; } catch (err) { $("msg").className = "msg err"; $("msg").textContent = "Could not read that file: " + err.message; } };
  rd.readAsText(f); e.target.value = "";
};
SPR.forEach((s) => { if (s.csv) s.m = model(s.csv); });
window.addEventListener("hashchange", route);
route();
</script>
</body>
